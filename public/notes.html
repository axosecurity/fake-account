<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Copy Credentials & Links</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 6px;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .item {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f1f5f9;
      outline: none;
      font-family: monospace;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }
    button:hover {
      background: #0369a1;
    }
    button:active {
      transform: scale(0.97);
    }
    button.copied {
      background: #16a34a !important;
    }
    .btn-link {
      background: #4f46e5;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      padding: 10px 18px;
      color: white;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-link:hover {
      background: #4338ca;
    }
    .scratchpad {
      margin-top: 24px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f1f5f9;
      font-family: monospace;
      font-size: 14px;
      outline: none;
      resize: vertical;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 Fast Copy & Paste Pad</h1>
    <p class="subtitle">Click "Copy" on any field to copy to clipboard, or click "Open Link" to launch the website in a new tab.</p>

    <!-- Username -->
    <div class="item">
      <label>Username</label>
      <div class="input-group">
        <input type="text" id="user" value="TarekRahaman" readonly onclick="this.select()">
        <button onclick="copyField('user', this)">Copy</button>
      </div>
    </div>

    <!-- Password -->
    <div class="item">
      <label>Password</label>
      <div class="input-group">
        <input type="text" id="pass" value="passwordforhacker@#12AXO" readonly onclick="this.select()">
        <button onclick="copyField('pass', this)">Copy</button>
      </div>
    </div>

    <!-- Phone -->
    <div class="item">
      <label>Phone Number</label>
      <div class="input-group">
        <input type="text" id="phone" value="01987654323" readonly onclick="this.select()">
        <button onclick="copyField('phone', this)">Copy</button>
      </div>
    </div>

    <!-- Referral Code -->
    <div class="item">
      <label>Referral Code</label>
      <div class="input-group">
        <input type="text" id="ref" value="MB1NHRXN" readonly onclick="this.select()">
        <button onclick="copyField('ref', this)">Copy</button>
      </div>
    </div>

    <!-- URL -->
    <div class="item">
      <label>Registration URL</label>
      <div class="input-group">
        <input type="text" id="url" value="https://nexorapaybd.com/register?ref=MB1NHRXN" readonly onclick="this.select()">
        <button onclick="copyField('url', this)">Copy</button>
        <a class="btn-link" href="https://nexorapaybd.com/register?ref=MB1NHRXN" target="_blank">Open Link ↗</a>
      </div>
    </div>

    <!-- Scratchpad for additional text -->
    <div class="scratchpad">
      <label>Scratchpad (Type or paste anything else here)</label>
      <textarea id="scratch" placeholder="Write or paste any notes or extra details here..."></textarea>
    </div>
  </div>

  <script>
    function copyField(elementId, btn) {
      const input = document.getElementById(elementId);
      input.select();
      input.setSelectionRange(0, 99999);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(onSuccess, fallback);
      } else {
        fallback();
      }

      function onSuccess() {
        showSuccess();
      }

      function fallback() {
        try {
          document.execCommand('copy');
          showSuccess();
        } catch (err) {
          alert('Please select and press Ctrl+C');
        }
      }

      function showSuccess() {
        const originalText = btn.innerText;
        btn.innerText = '✓ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerText = originalText;
          btn.classList.remove('copied');
        }, 1500);
      }
    }
  </script>
</body>
</html>
