name: "Sandbox Browser (Email Notification + Cloudflare)"

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duration to keep the sandbox alive (in minutes)"
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "360"
      email_recipient:
        description: "Email address to send the browser link to (leave empty to use secret TO_EMAIL)"
        required: false
        default: ""

jobs:
  run-sandbox:
    name: "Cloud Sandbox Browser"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Start Sandbox Browser in GitHub Cloud"
        run: |
          echo "::group::Starting Browser Container"
          # Check if local Dockerfile exists in repo; if so, build it, otherwise use prebuilt image
          if [ -f "Dockerfile" ]; then
            echo "Building custom browser from repository Dockerfile..."
            docker build -t sandbox-browser .
            docker run -d \
              --name=sandbox-browser \
              -p 8080:8080 \
              --shm-size=1g \
              --restart=unless-stopped \
              sandbox-browser
          else
            echo "Using fast prebuilt browser container..."
            docker run -d \
              --name=sandbox-browser \
              --security-opt seccomp=unconfined \
              -p 8080:3000 \
              --shm-size=1g \
              --restart=unless-stopped \
              lscr.io/linuxserver/chromium:latest
          fi

          echo "Waiting for browser web interface to be responsive on port 8080..."
          until curl -s http://localhost:8080 > /dev/null; do
            sleep 2
          done
          echo "✅ Sandbox browser is active on port 8080."
          echo "::endgroup::"

      - name: "Install & Start Cloudflare Tunnel"
        id: tunnel
        run: |
          echo "::group::Installing cloudflared"
          curl -sL --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          rm -f /tmp/cloudflared.deb
          echo "::endgroup::"

          echo "::group::Starting Quick Tunnel"
          cloudflared tunnel --no-autoupdate --url http://localhost:8080 > /tmp/tunnel.log 2>&1 &
          
          # Poll log for the generated public HTTPS URL
          for i in {1..20}; do
            URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::Could not obtain trycloudflare URL. Log contents:"
            cat /tmp/tunnel.log
            exit 1
          fi

          echo "BROWSER_URL=$URL" >> $GITHUB_ENV
          echo "::endgroup::"

          echo "=========================================================="
          echo "🚀 SANDBOX IS LIVE: $URL"
          echo "=========================================================="

      - name: "Send Link via Email"
        shell: python
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          INPUT_EMAIL: ${{ github.event.inputs.email_recipient }}
          SECRET_TO_EMAIL: ${{ secrets.TO_EMAIL }}
          BROWSER_URL: ${{ env.BROWSER_URL }}
          RUN_DURATION: ${{ github.event.inputs.duration_minutes || '60' }}
        run: |
          import os
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          smtp_user = os.environ.get("SMTP_USER", "").strip()
          smtp_pass = os.environ.get("SMTP_PASS", "").strip()
          to_email = os.environ.get("INPUT_EMAIL", "").strip() or os.environ.get("SECRET_TO_EMAIL", "").strip()
          url = os.environ.get("BROWSER_URL", "").strip()
          duration = os.environ.get("RUN_DURATION", "60")

          if not smtp_user or not smtp_pass or not to_email:
              print("⚠️ SMTP credentials or recipient email not configured. Skipping email dispatch.")
              print(f"To receive emails, set GitHub secrets: SMTP_USER, SMTP_PASS, and TO_EMAIL.")
              exit(0)

          host = os.environ.get("SMTP_HOST", "smtp.gmail.com")
          port = int(os.environ.get("SMTP_PORT", 587))

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "🚀 Your Sandbox Browser is Ready!"
          msg["From"] = f"GitHub Sandbox <{smtp_user}>"
          msg["To"] = to_email

          html_content = f"""
          <html>
            <body style="font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px;">
              <div style="max-width: 550px; margin: auto; background: #ffffff; border-radius: 8px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <h2 style="color: #1a73e8; margin-top: 0;">🌐 Your Remote Sandbox Browser is Ready</h2>
                <p>An isolated browser has been started on GitHub Actions with high-speed internet access.</p>
                <div style="margin: 25px 0; text-align: center;">
                  <a href="{url}" style="background-color: #1a73e8; color: #ffffff; padding: 14px 28px; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 6px; display: inline-block;">
                    Open Sandbox Browser
                  </a>
                </div>
                <p style="word-break: break-all; font-size: 13px; color: #555;">
                  Direct URL: <a href="{url}">{url}</a>
                </p>
                <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;" />
                <p style="font-size: 12px; color: #888;">
                  ⏱ Active for: <strong>{duration} minutes</strong><br/>
                  🔒 Ephemeral session: All history, cookies, and cache will be permanently wiped when the session finishes.
                </p>
              </div>
            </body>
          </html>
          """

          text_content = f"Your Sandbox Browser is ready!\n\nAccess it here: {url}\n\nSession duration: {duration} minutes."

          msg.attach(MIMEText(text_content, "plain"))
          msg.attach(MIMEText(html_content, "html"))

          try:
              server = smtplib.SMTP(host, port)
              server.starttls()
              server.login(smtp_user, smtp_pass)
              server.sendmail(smtp_user, [to_email], msg.as_string())
              server.quit()
              print(f"✅ Access link sent to {to_email} successfully!")
          except Exception as e:
              print(f"❌ Failed to send email: {e}")

      - name: "Keep Sandbox Session Running"
        run: |
          MINUTES="${{ github.event.inputs.duration_minutes || '60' }}"
          TOTAL_SECONDS=$((MINUTES * 60))
          ELAPSED=0

          echo "=========================================================="
          echo "🌐 SANDBOX ACTIVE IN GITHUB ACTIONS"
          echo "Link: ${{ env.BROWSER_URL }}"
          echo "Duration: $MINUTES minutes"
          echo "=========================================================="

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep 30
            ELAPSED=$((ELAPSED + 30))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[$(date +'%T')] 🟢 Sandbox online. Time remaining: ~$REMAINING min"
          done

          echo "Session expired. Destroying sandbox."
